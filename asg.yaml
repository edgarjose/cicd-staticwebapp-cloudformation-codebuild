AWSTemplateFormatVersion: "2010-09-09"

Description: Creates Auto Scaling Group

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Export VPC and ALB Stack Names"
        Parameters:
          - VpcID
          - PrivateSubnet1
          - PrivateSubnet2
      - Label:
          default: "Compute Configuration"
        Parameters:
          - AmiId
          - InstanceType
          - SecurityGroupWeb
          - ALBTargetGroup

Parameters:
  VpcID:
    Description: Import VPC ID
    Type: String

  PrivateSubnet1:
    Description: Import private subnet 2
    Type: String

  PrivateSubnet2:
    Description: Import private subnet 1
    Type: String

  SecurityGroupWeb:
    Description: Import Web server security Group
    Type: String

  ALBTargetGroup:
    Description: Importa ALB Target Group
    Type: String

  AmiId:
    Description: Amazon Linux 2023 x86_64 image resolved in this Region
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  InstanceType:
    Description: Amazon EC2 instance type for the instances
    Type: String
    AllowedValues:
      - t2.micro
      - t2.nano
      - t2.small
    Default: t2.micro

Resources:
  # Launch Template for EC2 instances
  PraticalLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -euo pipefail
            dnf install -y httpd unzip wget
            systemctl enable --now httpd
            cd /var/www/html
            wget https://github.com/edgarjose/festava_live/archive/refs/heads/main.zip
            unzip main.zip
            cp -r festava_live-main/* /var/www/html/
            rm -rf festava_live-main main.zip
        SecurityGroupIds:
          - !Ref SecurityGroupWeb
        Monitoring:
          Enabled: true

  # Auto Scaling Group
  PraticalAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      DesiredCapacity: 2
      HealthCheckGracePeriod: 300
      HealthCheckType: ELB
      Cooldown: 300
      LaunchTemplate:
        LaunchTemplateId: !Ref PraticalLaunchTemplate
        Version: !GetAtt PraticalLaunchTemplate.LatestVersionNumber
      MaxSize: 4
      MinSize: 2
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      VPCZoneIdentifier:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: WebServerAutoScaling
          PropagateAtLaunch: true

  PraticalCpuUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref PraticalAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70
