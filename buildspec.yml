version: 0.2

phases:
  pre_build:
    commands:
      - |
        set -eu
        cd "$CODEBUILD_SRC_DIR"
        : "${ARTIFACT_BUCKET:?Set ARTIFACT_BUCKET to a packaging bucket in this Region}"
        : "${DOMAIN_NAME:?Set DOMAIN_NAME to your existing hosted-zone domain}"
        : "${CERTIFICATE_ARN:?Set CERTIFICATE_ARN to an issued regional ACM certificate}"
        aws --version
        for template in master.yaml vpc.yaml natgateway.yaml alb.yaml asg.yaml route53.yaml; do
          aws cloudformation validate-template --template-body "file://$template"
        done
  build:
    commands:
      - |
        set -eu
        aws cloudformation package --template-file master.yaml --s3-bucket "$ARTIFACT_BUCKET" --output-template-file packaged.yaml
        aws cloudformation deploy --template-file packaged.yaml --stack-name "${STACK_NAME:-practical-static-codebuild}" --parameter-overrides "DomainName=$DOMAIN_NAME" "ACMCertificateArn=$CERTIFICATE_ARN" --no-fail-on-empty-changeset
        aws cloudformation describe-stacks --stack-name "${STACK_NAME:-practical-static-codebuild}" --query "Stacks[0].Outputs"

artifacts:
  files:
    - packaged.yaml
